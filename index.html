<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AppJoy</title>
<style>
  :root { --bg: #fffdf9; --text: #2b2118; --muted: #6e6257; --accent: #b87326; --card: #f6efe6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1712; --text: #f3ece4; --muted: #b3a79b; --accent: #e09a4a; --card: #2a221a; } }
  body { background: var(--bg); color: var(--text); font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 32px 16px; }
  main { max-width: 680px; margin: 0 auto; }
  h1 { color: var(--accent); margin-bottom: 4px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  .app { background: var(--card); border-radius: 12px; padding: 16px 20px; margin: 16px 0; }
  .app h2 { margin: 0 0 4px; font-size: 1.15em; }
</style>
</head>
<body>
<main>
  <h1>AppJoy</h1>
  <p class="muted">Simple, friendly apps for iPhone and Apple Watch.</p>

  <!-- One card per app. Each app's pages live in its own folder. -->
  <div class="app">
    <h2>Bread Crumbs: Find Your Way</h2>
    <p>Drops a trail as you go, so you can always find your way back to your car, hotel or trailhead.</p>
    <p><a href="bread-crumbs/support.html">Support</a> · <a href="bread-crumbs/privacy.html">Privacy Policy</a></p>
  </div>
</main>
</body>
</html>
